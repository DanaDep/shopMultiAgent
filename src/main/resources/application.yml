micronaut:
  application:
    name: shopMultiAgent
  server:
    port: 9090
  router:
    static-resources:
      default:
        paths: classpath:public
        mapping: /**

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION_KEY_PROPERTY}

langchain4j:
  bedrock:
    chat-model:
      model-id: ${AWS_BEDROCK_MODEL_ID}
      region: ${AWS_REGION_KEY_PROPERTY}
      timeout: 180s
      max-output-tokens: 4096
      temperature: 0.2

otel:
  service:
    name: shop-multi-agent
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: http://localhost:4318   # OTel Collector (fans out to backends; see observability/)
      protocol: http/protobuf